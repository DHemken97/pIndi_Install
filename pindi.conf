# PiNDI settings. Installed to /etc/default/pindi.
# After editing: sudo systemctl restart pindi

# NDI stream name to look for. Default: OUT_<serial>, e.g. OUT_00000000db6dac89
# (the serial without leading zeros is accepted too). Any host may send it.
#PINDI_STREAM=

# Only accept the stream from this sender IP (default: any host). The IP is
# also queried directly, so a sender on another subnet is found without mDNS.
#PINDI_SOURCE_IP=

# "highest" (full quality) or "lowest" (low-res preview stream; use this if
# the Pi 3B cannot keep up decoding a 1080p source).
#PINDI_BANDWIDTH=highest

# The splash returns as soon as the NDI connection is lost. Optionally also show
# it when a still-connected source sends no frames for this long (ms).
# 0 = keep the last frame (screen capture senders only send frames on change).
#PINDI_FRAME_TIMEOUT_MS=0

# Log receive statistics every N seconds while connected (0 = off).
#PINDI_STATS_SEC=60

# Comma separated IPs of NDI senders to find without mDNS (other subnets).
#PINDI_EXTRA_IPS=

# Display orientation, done by the display hardware (no CPU cost).
# PINDI_ROTATE: 0 or 180. PINDI_MIRROR: none, horizontal or vertical.
#PINDI_ROTATE=0
#PINDI_MIRROR=none

# Force an HDMI mode, e.g. 1920x1080@60 or 1280x720. Default: monitor's preferred.
#PINDI_MODE=

#PINDI_SPLASH=/usr/share/pindi/splash.jpg
#PINDI_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
