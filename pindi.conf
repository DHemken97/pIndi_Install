# PiNDI settings. Installed to /etc/default/pindi.
# Normally edited through the web interface (http://<device IP>/).
# After editing by hand: sudo systemctl restart pindi pindi-sender

# ---- Display outputs: PINDI_OUT<n>_* (n = 1, 2, ... as listed in the web UI) ----
#
# PINDI_OUT<n>_ENABLED=0       disable the output: no NDI received, HDMI signal off
# PINDI_OUT<n>_STREAM=         NDI stream name to show. Default: OUT_<serial> for
#                              output 1, OUT_<serial>_<n> for the others (the serial
#                              without leading zeros is accepted too). Any host.
# PINDI_OUT<n>_SOURCE_IP=      only accept the stream from this sender IP (default
#                              any). Also queried directly, so other subnets work.
# PINDI_OUT<n>_ROTATE=0        0 or 180 (display hardware, no CPU cost)
# PINDI_OUT<n>_MIRROR=none     none, horizontal or vertical
# PINDI_OUT<n>_MODE=           force an HDMI mode, e.g. 1920x1080@60. Default: the
#                              monitor's preferred mode, capped at 1080p.
# PINDI_OUT<n>_BANDWIDTH=      highest or lowest (see PINDI_BANDWIDTH below)
#
# (For output 1 the older names PINDI_STREAM, PINDI_SOURCE_IP, PINDI_ROTATE,
#  PINDI_MIRROR and PINDI_MODE still work.)

# ---- Outgoing streams from USB capture devices: PINDI_IN<n>_* ----
# Nothing is sent unless enabled ("Configure Outgoing Streams" in the web UI).
#
# PINDI_IN<n>_ENABLED=1
# PINDI_IN<n>_DEVICE=/dev/v4l/by-id/...    stable device path
# PINDI_IN<n>_NAME=                        default IN_<serial> (IN_<serial>_<n> for n > 1)
# PINDI_IN<n>_MODE="MJPG 1920x1080@30"     default: best mode up to 1080p30
# PINDI_IN<n>_AUDIO_SYNC=off               send the audio with the device's own timing; default:
#                                          kept in step with this Pi's clock (capture cards' audio
#                                          clocks drift, and receivers then drop audio to catch up)

# ---- Receiving, all outputs ----

# "highest" (full quality) or "lowest" (low-res preview stream). Default for
# outputs without their own PINDI_OUT<n>_BANDWIDTH.
#PINDI_BANDWIDTH=highest
#
# Codec: the standard NDI SDK receives and sends Full NDI (SpeedHQ) only.
# NDI|HX (H.264/HEVC) needs the NDI Advanced SDK; software HX senders fall back
# to Full NDI for this device, HX-only cameras show no picture.

# The splash returns as soon as the NDI connection is lost. Optionally also show
# it when a still-connected source sends no frames for this long (ms).
# 0 = keep the last frame (screen capture senders only send frames on change).
#PINDI_FRAME_TIMEOUT_MS=0

# Log receive statistics every N seconds while connected (0 = off).
#PINDI_STATS_SEC=60

# Comma separated IPs of NDI senders to find without mDNS (other subnets).
#PINDI_EXTRA_IPS=

# 0 = plain splash: no IP address, serial or status text on it.
#PINDI_SPLASH_INFO=1

# NDI Discovery Server, groups, the device's NDI name and the receive transport
# (TCP or UDP) are set in the web UI ("Device settings") and stored in
# /etc/pindi/ndi-config.v1.json.

# 0 = the system's own network buffer sizes (208 KB) instead of 4 MB, which
# drop packets when sending 1080p to more than one receiver.
#PINDI_NET_BUFFERS=1

#PINDI_SPLASH=/usr/share/pindi/splash.jpg
#PINDI_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
